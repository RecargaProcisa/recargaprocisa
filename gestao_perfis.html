<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Perfis - PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="font-bold text-lg tracking-wide">
            PROCISA <span class="font-normal text-xs bg-purple-600 px-2 py-1 rounded ml-2 text-purple-100">Gestão de Perfis</span>
        </div>
        <div class="flex gap-4">
            <a href="painel.html" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded border border-slate-500 transition">&larr; Voltar ao Painel</a>
        </div>
    </header>

    <main class="p-6 max-w-6xl mx-auto mt-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form Column -->
        <div class="bg-white p-6 rounded-xl shadow border border-slate-200 lg:col-span-1 h-fit">
            <h2 class="text-lg font-bold text-blue-900 mb-4">Novo Perfil</h2>
            <form id="formPerfil" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo *</label>
                    <input type="text" id="nome" required placeholder="Nome do colaborador"
                        class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">E-mail (Login) *</label>
                    <input type="email" id="email" required placeholder="usuario@procisa.com.br"
                        class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Matrícula *</label>
                        <input type="text" id="matricula" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Senha Inicial *</label>
                        <input type="password" id="senha" required placeholder="••••••••"
                            class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-600 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nível de Acesso (Perfil) *</label>
                    <select id="role" required 
                        class="w-full px-3 py-2 border border-slate-300 rounded bg-white focus:ring-2 focus:ring-purple-600 focus:outline-none">
                        <option value="ADM">Administrativo (ADM)</option>
                        <option value="GESTAO_CAMPO">Gestão de Campo (Coordenador)</option>
                        <option value="MASTER">Master (Gestão de Recarga)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Projeto *</label>
                    <input type="text" id="projeto" required list="listaProjetos" placeholder="Digite para criar ou selecione..." 
                        class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-600 focus:outline-none uppercase">
                    <datalist id="listaProjetos"></datalist>
                </div>

                <button type="submit" id="btnSalvar" 
                    class="w-full bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2.5 rounded transition shadow mt-4">
                    Criar Perfil
                </button>
                <div id="msgFeedback" class="mt-3 p-3 rounded text-sm hidden"></div>
            </form>
        </div>

        <!-- List Column -->
        <div class="bg-white p-6 rounded-xl shadow border border-slate-200 lg:col-span-2 overflow-hidden flex flex-col">
            <h2 class="text-lg font-bold text-blue-900 mb-4">Perfis Cadastrados</h2>
            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-sm">
                            <th class="p-3">Matrícula</th>
                            <th class="p-3">Nome</th>
                            <th class="p-3">Perfil</th>
                            <th class="p-3">Projeto</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPerfis" class="text-sm">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let usuarioAtual = null;

        async function checarAcesso() {
            // Verifica o acesso usando o config.js global
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const { data: perfil } = await supabaseClient.from('perfis_usuarios').select('perfil, projeto_id').eq('id', user.id).single();
            
            // Controle de Rota: Apenas Master e Coordenador
            if (!perfil || (perfil.perfil !== 'MASTER' && perfil.perfil !== 'GESTAO_CAMPO')) {
                alert('Acesso negado. Perfil sem permissão para gestão.');
                window.location.href = 'painel.html';
                return;
            }
            
            usuarioAtual = { ...user, role: perfil.perfil, projeto_id: perfil.projeto_id };
            
            // Regra de Negócio: Coordenador só cria ADM no próprio projeto
            if (perfil.perfil === 'GESTAO_CAMPO') {
                document.getElementById('role').innerHTML = '<option value="ADM">Administrativo (ADM)</option>';
                
                // Busca o nome do projeto do coordenador para travar o input
                const { data: projData } = await supabaseClient.from('projetos').select('nome').eq('id', perfil.projeto_id).single();
                
                const inputProjeto = document.getElementById('projeto');
                inputProjeto.value = projData ? projData.nome : 'PROJETO VINCULADO';
                inputProjeto.readOnly = true;
                inputProjeto.className = "w-full px-3 py-2 border border-slate-200 rounded bg-slate-100 focus:outline-none uppercase text-slate-500";
            }

            carregarProjetos();
            carregarPerfisCadastrados();
        }

        async function carregarProjetos() {
            const datalist = document.getElementById('listaProjetos');
            const { data } = await supabaseClient.from('projetos').select('nome').order('nome');
            if (data) {
                datalist.innerHTML = data.map(p => `<option value="${p.nome}">`).join('');
            }
        }

        async function carregarPerfisCadastrados() {
            const tbody = document.getElementById('tabelaPerfis');
            
            let query = supabaseClient.from('perfis_usuarios').select(`
                matricula, nome, perfil, ativo,
                projetos (nome)
            `).order('nome');

            // Filtro: Coordenador só enxerga usuários do seu projeto
            if (usuarioAtual.role === 'GESTAO_CAMPO') {
                query = query.eq('projeto_id', usuarioAtual.projeto_id);
            }

            const { data, error } = await query;

            if (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">Erro ao carregar os perfis.</td></tr>';
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">Nenhum perfil encontrado.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-slate-700">${p.matricula || '-'}</td>
                    <td class="p-3">${p.nome || '-'}</td>
                    <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs uppercase font-medium">${p.perfil}</span></td>
                    <td class="p-3 text-slate-600">${p.projetos ? p.projetos.nome : '-'}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-xs font-medium ${p.ativo !== false ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${p.ativo !== false ? 'Ativo' : 'Inativo'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const msg = document.getElementById('msgFeedback');
            
            btn.disabled = true; btn.innerText = 'Salvando...';
            msg.classList.add('hidden');

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const matricula = document.getElementById('matricula').value.trim();
            const senha = document.getElementById('senha').value;
            const role = document.getElementById('role').value;
            const projetoNome = document.getElementById('projeto').value.trim().toUpperCase();

            try {
                let projeto_id = usuarioAtual.projeto_id; 
                
                // Se for Master, gerencia o salvamento dinâmico do projeto
                if (usuarioAtual.role === 'MASTER' && projetoNome) {
                    let { data: projBusca } = await supabaseClient.from('projetos').select('id').eq('nome', projetoNome).single();
                    
                    if (!projBusca) {
                        const { data: novoProj, error: errProj } = await supabaseClient.from('projetos').insert([{ nome: projetoNome }]).select().single();
                        if (errProj) throw new Error("Falha ao cadastrar novo projeto.");
                        projeto_id = novoProj.id;
                    } else {
                        projeto_id = projBusca.id;
                    }
                }

                // Cria o usuário na Auth do Supabase
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: senha,
                });

                if (authError) throw authError;

                // Atualiza a tabela pública 'perfis_usuarios'
                if (authData.user) {
                    const { error: perfilError } = await supabaseClient.from('perfis_usuarios').upsert({
                        id: authData.user.id,
                        nome: nome,
                        matricula: matricula,
                        perfil: role,
                        projeto_id: projeto_id,
                        criado_por: usuarioAtual.id,
                        ativo: true
                    });
                    if (perfilError) throw perfilError;
                }

                msg.className = 'mt-3 p-3 rounded text-sm bg-green-100 text-green-800 border border-green-200';
                msg.innerText = 'Perfil criado com sucesso!';
                document.getElementById('formPerfil').reset();
                carregarProjetos();
                carregarPerfisCadastrados();

            } catch (error) {
                msg.className = 'mt-3 p-3 rounded text-sm bg-red-100 text-red-800 border border-red-200';
                msg.innerText = error.message;
            } finally {
                btn.disabled = false; btn.innerText = 'Criar Perfil';
                msg.classList.remove('hidden');
            }
        });

        // Inicia a validação ao abrir
        checarAcesso();
    </script>
</body>
</html>

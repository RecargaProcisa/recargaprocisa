<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Perfis - PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-blue-900 text-white px-6 py-4 shadow-lg border-b-4 border-blue-700">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <span class="font-black text-xl tracking-wider text-blue-100">PROCISA</span>
                <span class="text-xs bg-purple-600 px-3 py-1 rounded-full text-white font-bold ml-3 uppercase tracking-wider">Gestão de Perfis</span>
            </div>
            <a href="painel.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded font-bold transition shadow">&larr; Voltar ao Painel</a>
        </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 lg:col-span-4 h-fit">
            <h2 class="text-xl font-extrabold text-blue-900 mb-4 border-b pb-2">Cadastrar / Editar Usuário</h2>
            <form id="formPerfil" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nome Completo *</label>
                    <input type="text" id="nome" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600 uppercase">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Matrícula *</label>
                        <input type="text" id="matricula" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600 font-bold">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Senha *</label>
                        <input type="password" id="senha" required placeholder="Mín. 6 dígitos" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Grupo *</label>
                    <select id="role" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-purple-600 font-semibold bg-white">
                        <option value="ADM">ADM (Validação Primária)</option>
                        <option value="GESTAO_CAMPO">GESTAO_CAMPO (Coordenador)</option>
                        <option value="MASTER">MASTER (Gestão de Recarga)</option>
                    </select>
                </div>
                
                <!-- BLOCO SUSPENSO DE PROJETOS -->
                <div class="relative">
                    <label class="block text-sm font-bold text-slate-700 mb-1">Projetos (Marque 1 ou mais) *</label>
                    <button type="button" id="btnDropdownProjetos" onclick="document.getElementById('menuDropdownProjetos').classList.toggle('hidden')" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg bg-white text-left flex justify-between items-center focus:ring-2 focus:ring-purple-600 transition">
                        <span id="textoProjetosSelecionados" class="text-sm text-slate-600 truncate font-medium">Selecione os projetos...</span> <span class="text-xs">▼</span>
                    </button>
                    <div id="menuDropdownProjetos" class="hidden absolute z-30 mt-1 w-full bg-white border border-slate-300 rounded-xl shadow-2xl p-3 max-h-64 overflow-y-auto">
                        <div id="listaCheckboxesProjetos" class="space-y-1.5 text-sm"></div>
                    </div>
                </div>
                
                <button type="submit" id="btnSalvar" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-extrabold py-3 rounded-lg shadow-md mt-4 transition">Salvar Usuário</button>
                <div id="msgFeedback" class="mt-3 p-3 rounded-lg text-sm hidden font-bold text-center"></div>
            </form>
        </div>

        <!-- TABELA DE USUÁRIOS -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border border-slate-200 lg:col-span-8 flex flex-col">
            <h2 class="text-xl font-extrabold text-blue-900 border-b pb-2 mb-4">Usuários sob sua Gestão</h2>
            <div class="overflow-x-auto flex-grow rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs uppercase">
                            <th class="p-3.5 font-extrabold">Matrícula</th>
                            <th class="p-3.5 font-extrabold">Nome</th>
                            <th class="p-3.5 font-extrabold">Grupo</th>
                            <th class="p-3.5 font-extrabold">Projetos Vinculados</th>
                            <th class="p-3.5 text-center font-extrabold">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPerfis" class="text-sm divide-y divide-slate-200">
                        <tr><td colspan="5" class="p-6 text-center text-slate-500 font-bold">Carregando usuários...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let usuarioAtual = null;
        let todosProjetosBanco = [];

        // Fecha o dropdown se clicar fora
        document.addEventListener('click', (e) => {
            const btn = document.getElementById('btnDropdownProjetos');
            const menu = document.getElementById('menuDropdownProjetos');
            if (!btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function atualizarTextoProjetos() {
            const selecionados = Array.from(document.querySelectorAll('.chk-projeto:checked')).map(cb => cb.value);
            const span = document.getElementById('textoProjetosSelecionados');
            if (selecionados.length === 0) {
                span.innerText = 'Nenhum selecionado (Global)';
                span.className = 'text-sm text-slate-400 truncate';
            } else {
                span.innerText = `${selecionados.length} projeto(s) selecionado(s)`;
                span.className = 'text-sm text-purple-900 font-bold truncate';
            }
        }

        async function carregarProjetos() {
            const { data } = await supabaseClient.from('projetos').select('nome').order('nome');
            todosProjetosBanco = data ? data.map(p => p.nome) : [];
            let disponiveis = usuarioAtual.role === 'GESTAO_CAMPO' ? (usuarioAtual.projetos.length > 0 ? usuarioAtual.projetos : todosProjetosBanco) : todosProjetosBanco;
            
            document.getElementById('listaCheckboxesProjetos').innerHTML = disponiveis.map(nome => `
                <label class="flex items-center gap-2 p-1.5 hover:bg-purple-50 rounded cursor-pointer border border-transparent hover:border-purple-200 transition">
                    <input type="checkbox" value="${nome}" onchange="atualizarTextoProjetos()" class="chk-projeto w-4 h-4 text-purple-600 rounded">
                    <span class="font-bold text-slate-700 text-[11px]">${nome}</span>
                </label>
            `).join('');
        }

        async function checarAcesso() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return window.location.href = 'login.html';
            const { data: p } = await supabaseClient.from('perfis_usuarios').select('*').eq('id', user.id).single();
            usuarioAtual = { id: user.id, matricula: p.matricula, role: p.perfil, projetos: p.projetos || [] };
            
            if (p.perfil === 'GESTAO_CAMPO') {
                document.getElementById('role').innerHTML = '<option value="ADM">ADM (Validação Primária)</option>';
            }
            await carregarProjetos();
            await carregarPerfisCadastrados();
        }

        async function carregarPerfisCadastrados() {
            const tbody = document.getElementById('tabelaPerfis');
            let query = supabaseClient.from('perfis_usuarios').select('*').order('nome');
            
            // REGRA: Coordenador só vê quem ele criou. Master vê todos.
            if (usuarioAtual.role === 'GESTAO_CAMPO') {
                query = query.eq('criado_por', usuarioAtual.id);
            }

            const { data, error } = await query;
            if (error) { tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-600 font-bold">Erro: ${error.message}</td></tr>`; return; }

            // REGRA (STEALTH MODE): Ocultar o utilizador 00000 de toda a gente, exceto dele próprio
            const perfisVisiveis = (data || []).filter(p => {
                if (p.matricula === '00000' && usuarioAtual.matricula !== '00000') {
                    return false; // Esconde a linha do Master 00000
                }
                return true;
            });

            if (perfisVisiveis.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500 font-bold">Nenhum utilizador encontrado sob a sua gestão.</td></tr>';
                return;
            }

            tbody.innerHTML = perfisVisiveis.map(p => {
                const projs = (p.projetos && p.projetos.length > 0) ? p.projetos.map(pr => `<span class="bg-purple-100 text-purple-900 px-1.5 py-0.5 rounded text-[10px] font-bold mr-1 inline-block mb-1 border border-purple-200">${pr}</span>`).join('') : '<span class="text-xs text-slate-400 italic">Global / Sem restrição</span>';
                
                // REGRA: Master não pode ser excluído
                const bloqueiaExclusao = (p.matricula === '00000');
                
                return `
                <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                    <td class="p-3.5 font-black text-blue-900">${p.matricula}</td>
                    <td class="p-3.5 font-semibold text-slate-800">${p.nome}</td>
                    <td class="p-3.5"><span class="bg-blue-100 text-blue-900 px-2.5 py-1 rounded text-xs font-extrabold uppercase tracking-wide">${p.perfil}</span></td>
                    <td class="p-3.5 max-w-[200px]">${projs}</td>
                    <td class="p-3.5 text-center flex justify-center gap-1.5">
                        <button onclick='editar(${JSON.stringify(p)})' class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded text-xs font-bold transition hover:bg-amber-200">Editar</button>
                        ${!bloqueiaExclusao ? `<button onclick="excluir('${p.id}', '${p.nome}')" class="bg-red-100 text-red-700 px-3 py-1.5 rounded text-xs font-bold transition hover:bg-red-200">Excluir</button>` : ''}
                    </td>
                </tr>`
            }).join('');
        }

        window.editar = function(p) {
            document.getElementById('nome').value = p.nome;
            document.getElementById('matricula').value = p.matricula;
            document.getElementById('role').value = p.perfil;
            document.getElementById('senha').placeholder = 'Digite para alterar a senha';
            document.getElementById('senha').removeAttribute('required'); 
            
            document.querySelectorAll('.chk-projeto').forEach(cb => cb.checked = (p.projetos || []).includes(cb.value));
            atualizarTextoProjetos();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.excluir = async function(id, nome) {
            if(!confirm(`⚠️ ATENÇÃO: Deseja excluir PERMANENTEMENTE o usuário ${nome}?`)) return;
            try {
                await supabaseClient.rpc('excluir_usuario_admin', { p_user_id: id });
                carregarPerfisCadastrados();
            } catch (err) {
                alert("Erro ao excluir: " + err.message);
            }
        };

        document.getElementById('formPerfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const msg = document.getElementById('msgFeedback');
            btn.disabled = true; btn.innerText = 'Salvando...'; msg.classList.add('hidden');

            const roleSelecionada = document.getElementById('role').value;
            const projetosSelecionados = Array.from(document.querySelectorAll('.chk-projeto:checked')).map(cb => cb.value);

            if (roleSelecionada !== 'MASTER' && projetosSelecionados.length === 0) {
                alert("Por favor, selecione pelo menos 1 projeto no menu suspenso!");
                btn.disabled = false; btn.innerText = 'Salvar Usuário';
                return;
            }

            const payload = {
                p_nome: document.getElementById('nome').value.trim(),
                p_matricula: document.getElementById('matricula').value.trim(),
                p_senha: document.getElementById('senha').value || 'SenhaMantida123', 
                p_perfil: roleSelecionada,
                p_projetos: projetosSelecionados,
                p_criador_id: usuarioAtual.id
            };

            try {
                await supabaseClient.rpc('criar_usuario_admin', payload);
                if(document.getElementById('senha').value) {
                    const {data: usr} = await supabaseClient.from('perfis_usuarios').select('id').eq('matricula', payload.p_matricula).single();
                    if(usr) await supabaseClient.rpc('resetar_senha_admin', { p_user_id: usr.id, p_nova_senha: payload.p_senha });
                }

                msg.className = 'mt-3 p-3 rounded-lg text-sm font-bold bg-green-100 text-green-800 border border-green-300 text-center';
                msg.innerText = '✅ Usuário salvo com sucesso!';
                
                document.getElementById('formPerfil').reset();
                document.getElementById('senha').setAttribute('required', 'true');
                document.getElementById('senha').placeholder = 'Mín. 6 dígitos';
                document.querySelectorAll('.chk-projeto').forEach(cb => cb.checked = false);
                atualizarTextoProjetos();
                carregarPerfisCadastrados();
            } catch (err) {
                msg.className = 'mt-3 p-3 rounded-lg text-sm font-bold bg-red-100 text-red-800 border border-red-300 text-center';
                msg.innerText = '❌ Erro ao salvar: ' + err.message;
            } finally {
                btn.disabled = false; btn.innerText = 'Salvar Usuário'; msg.classList.remove('hidden');
            }
        });
        checarAcesso();
    </script>
</body>
</html>

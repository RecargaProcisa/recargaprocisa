<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Gestão de Recargas PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Faixa Azul Padronizada -->
    <header class="bg-blue-900 text-white px-6 py-4 shadow-lg border-b-4 border-blue-700">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 items-center gap-4">
            <div class="flex items-center gap-3 justify-center md:justify-start">
                <span class="font-black text-xl tracking-wider text-blue-100">PROCISA</span>
                <span id="tagPerfil" class="text-xs bg-blue-700 px-3 py-1 rounded-full text-blue-100 font-bold uppercase tracking-wider">...</span>
            </div>
            <div class="text-center">
                <h1 class="text-2xl font-extrabold tracking-widest uppercase text-white">GESTÃO DE RECARGAS</h1>
                <p class="text-xs text-blue-200 font-medium tracking-wide mt-0.5">Gestor Luis Manuel Luviano Saldana</p>
            </div>
            <div class="flex gap-2 justify-center md:justify-end">
                <button onclick="trocarMinhaSenha()" class="text-xs bg-blue-800 hover:bg-blue-700 px-3 py-2 rounded border border-blue-600 transition font-semibold">
                    🔒 Trocar Senha
                </button>
                <button onclick="sair()" class="text-xs bg-red-600 hover:bg-red-700 px-4 py-2 rounded border border-red-500 transition font-bold">
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main id="conteudoDinamico" class="p-6 md:p-10 max-w-7xl mx-auto">
        <div class="text-center text-slate-500 mt-16 text-lg">Carregando permissões do perfil...</div>
    </main>

    <script>
        async function sair() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        async function trocarMinhaSenha() {
            const novaSenha = prompt("🔒 Digite a sua NOVA senha (mínimo de 6 caracteres):");
            if (!novaSenha) return;
            if (novaSenha.length < 6) { alert("A senha deve ter pelo menos 6 caracteres."); return; }
            
            const { error } = await supabaseClient.auth.updateUser({ password: novaSenha });
            if (error) alert("Erro ao atualizar senha: " + error.message);
            else alert("✅ Senha alterada com sucesso!");
        }

        async function carregarPainel() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }

            const { data: perfil, error } = await supabaseClient
                .from('perfis_usuarios')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error || !perfil) {
                document.getElementById('conteudoDinamico').innerHTML = `
                    <div class="bg-red-100 p-6 rounded-xl text-red-800 text-center font-bold border border-red-300">
                        Seu usuário não possui perfil configurado. Contate a Gestão de Recarga (Master).
                    </div>`;
                return;
            }

            const nomeExibicaoPerfil = perfil.perfil === 'MASTER' ? 'GESTÃO DE RECARGA (MASTER)' : 
                                       perfil.perfil === 'GESTAO_CAMPO' ? 'GESTÃO DE CAMPO (COORD.)' : perfil.perfil;
            document.getElementById('tagPerfil').innerText = nomeExibicaoPerfil;

            const listaProjetos = (perfil.projetos && perfil.projetos.length > 0) 
                ? perfil.projetos.map(p => `<span class="bg-blue-100 text-blue-900 px-2.5 py-1 rounded text-xs font-bold">${p}</span>`).join(' ')
                : `<span class="text-slate-400 text-xs">Todos / Global</span>`;

            const main = document.getElementById('conteudoDinamico');

            let cardsHtml = '';

            if (perfil.perfil === 'MASTER') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <a href="todas_solicitacoes.html" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-blue-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">💳</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Painel de Recargas</h2>
                                <p class="text-sm text-slate-600">Visão consolidada global. Liberação de saldo VALE CARD, auditoria de aprovações, KM e fotos.</p>
                            </div>
                            <span class="mt-6 inline-block text-blue-700 font-bold text-sm">Acessar Fila Global &rarr;</span>
                        </a>

                        <a href="gestao_perfis.html" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-purple-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">👥</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Gestão de Perfis</h2>
                                <p class="text-sm text-slate-600">Cadastrar usuários em múltiplos projetos, redefinir senhas e gerenciar permissões (ADM, Coordenação e Master).</p>
                            </div>
                            <span class="mt-6 inline-block text-purple-700 font-bold text-sm">Gerenciar Usuários &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">➕</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Solicitação Manual</h2>
                                <p class="text-sm text-slate-600">Lançar uma solicitação de recarga diretamente pela gestão inserindo matrícula do técnico e fotos.</p>
                            </div>
                            <span class="mt-6 inline-block text-emerald-700 font-bold text-sm">Abrir Formulário &rarr;</span>
                        </a>
                    </div>
                `;
            } 
            else if (perfil.perfil === 'GESTAO_CAMPO') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <a href="todas_solicitacoes.html" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-orange-500 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">✅</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Aprovação & Bypass ADM</h2>
                                <p class="text-sm text-slate-600">Aprovação final global (AGUARDANDO GESTÃO) e atuação direta nas solicitações NOVAS dos seus projetos.</p>
                            </div>
                            <span class="mt-6 inline-block text-orange-600 font-bold text-sm">Analisar Solicitações &rarr;</span>
                        </a>

                        <a href="gestao_perfis.html" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-purple-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">👤</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Minha Equipe ADM</h2>
                                <p class="text-sm text-slate-600">Visualizar e cadastrar usuários administrativos vinculados aos seus projetos.</p>
                            </div>
                            <span class="mt-6 inline-block text-purple-700 font-bold text-sm">Gerenciar ADMs &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">🚗</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Nova Solicitação Manual</h2>
                                <p class="text-sm text-slate-600">Registrar recarga manualmente para um técnico de campo com upload das 4 fotos obrigatórias.</p>
                            </div>
                            <span class="mt-6 inline-block text-emerald-700 font-bold text-sm">Lançar Recarga &rarr;</span>
                        </a>
                    </div>
                `;
            }
            else if (perfil.perfil === 'ADM') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <a href="todas_solicitacoes.html" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-blue-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">🔍</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Fila de Validação ADM</h2>
                                <p class="text-sm text-slate-600">Conferir fotos, validar parâmetro de 260 KM, preencher Motivo da Recarga e Saldo Solicitado dos seus projetos.</p>
                            </div>
                            <span class="mt-6 inline-block text-blue-700 font-bold text-sm">Acessar Solicitações &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-2xl transition flex flex-col justify-between min-h-[250px]">
                            <div>
                                <div class="text-4xl mb-4">📝</div>
                                <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Nova Solicitação Manual</h2>
                                <p class="text-sm text-slate-600">Preencher formulário em nome do técnico de campo (caso ele esteja sem acesso) subindo as 4 fotos obrigatórias.</p>
                            </div>
                            <span class="mt-6 inline-block text-emerald-700 font-bold text-sm">Preencher Manualmente &rarr;</span>
                        </a>
                    </div>
                `;
            }

            main.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <p class="text-xs font-bold uppercase text-slate-400">Usuário Conectado</p>
                        <h2 class="text-2xl font-black text-slate-800">${perfil.nome} <span class="text-sm font-semibold text-slate-500">(Mat: ${perfil.matricula})</span></h2>
                    </div>
                    <div>
                        <p class="text-xs font-bold uppercase text-slate-400 mb-1">Projetos Vinculados</p>
                        <div class="flex flex-wrap gap-1.5">${listaProjetos}</div>
                    </div>
                </div>
                ${cardsHtml}
            `;
        }

        carregarPainel();
    </script>
</body>
</html>

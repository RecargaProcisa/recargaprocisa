<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel - Gestão de Recargas PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

    <!-- Faixa Azul Padronizada 100% Tela -->
    <header class="bg-blue-900 text-white px-4 md:px-6 py-3 md:py-4 shadow-lg border-b-4 border-blue-700">
        <div class="w-full flex flex-col md:grid md:grid-cols-3 items-center gap-2 md:gap-4">
            <div class="w-full md:w-auto flex items-center justify-between md:justify-start gap-2">
                <div class="flex items-center gap-2">
                    <span class="font-black text-lg md:text-xl tracking-wider text-blue-100">PROCISA</span>
                    <span id="tagPerfil" class="text-[10px] md:text-xs bg-blue-700 px-2.5 py-0.5 md:py-1 rounded-full text-blue-100 font-bold uppercase tracking-wider">...</span>
                </div>
                <div class="flex md:hidden gap-1.5">
                    <button onclick="trocarMinhaSenha()" class="text-[11px] bg-blue-800 px-2.5 py-1.5 rounded-lg border border-blue-600 font-semibold">🔒 Senha</button>
                    <button onclick="sair()" class="text-[11px] bg-red-600 px-3 py-1.5 rounded-lg font-bold">Sair</button>
                </div>
            </div>
            <div class="text-center leading-tight">
                <h1 class="text-base md:text-2xl font-extrabold tracking-widest uppercase text-white">GESTÃO DE RECARGAS</h1>
                <p class="text-[10px] md:text-xs text-blue-200 font-medium tracking-wide">Gestor Luis Manuel Luviano Saldana</p>
            </div>
            <div class="w-full md:w-auto flex flex-col items-center md:items-end gap-1.5 shrink-0">
                <div class="hidden md:flex gap-2 justify-end">
                    <button onclick="trocarMinhaSenha()" class="text-xs bg-blue-800 hover:bg-blue-700 px-3 py-2 rounded border border-blue-600 transition font-semibold shadow">
                        🔒 Trocar Senha
                    </button>
                    <button onclick="sair()" class="text-xs bg-red-600 hover:bg-red-700 px-4 py-2 rounded border border-red-500 transition font-bold shadow">
                        Sair
                    </button>
                </div>
                <div class="text-[8px] md:text-[9px] text-blue-300 md:text-right text-center uppercase font-bold leading-tight">
                    <span class="text-blue-400">Desenvolvido por:</span> Leonardo Simoes De Almeida &bull; Keith Christien De Jesus Antunes
                </div>
            </div>
        </div>
    </header>

    <!-- Main 100% Tela -->
    <main id="conteudoDinamico" class="p-4 md:p-8 w-full space-y-4">
        <div class="text-center text-slate-500 mt-16 text-lg font-bold">Carregando permissões do perfil...</div>
    </main>

    <script>
        async function sair() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        async function trocarMinhaSenha() {
            const novaSenha = prompt("🔒 Digite a sua NOVA senha (mínimo de 6 caracteres):");
            if (!novaSenha) return;
            if (novaSenha.length < 6) { alert("A senha deve ter pelo menos 6 caracteres."); return; }
            
            const { error } = await supabaseClient.auth.updateUser({ password: novaSenha });
            if (error) alert("Erro ao atualizar senha: " + error.message);
            else alert("✅ Senha alterada com sucesso!");
        }

        async function carregarPainel() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }

            const { data: perfil, error } = await supabaseClient
                .from('perfis_usuarios')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error || !perfil) {
                document.getElementById('conteudoDinamico').innerHTML = `
                    <div class="bg-red-100 p-6 rounded-xl text-red-800 text-center font-bold border border-red-300 shadow">
                        Seu usuário não possui perfil configurado. Contate a Gestão de Recarga (Master).
                    </div>`;
                return;
            }

            const nomeExibicaoPerfil = perfil.perfil === 'MASTER' ? 'MASTER (RECARGA)' : 
                                       perfil.perfil === 'GESTAO_CAMPO' ? 'COORDENAÇÃO' : perfil.perfil;
            document.getElementById('tagPerfil').innerText = nomeExibicaoPerfil;

            // Busca rápida de quantas solicitações estão aguardando ação imediata deste usuário
            let qtdPendenteAcao = 0;
            const { data: todasSol } = await supabaseClient.from('solicitacoes_recarga').select('status, projeto');
            if (todasSol) {
                const projsUser = perfil.projetos || [];
                todasSol.forEach(s => {
                    if (perfil.perfil === 'MASTER' && s.status === 'AGUARDANDO_RECARGA') qtdPendenteAcao++;
                    else if (perfil.perfil === 'GESTAO_CAMPO' && s.status === 'AGUARDANDO_GESTAO' && projsUser.includes(s.projeto)) qtdPendenteAcao++;
                    else if (perfil.perfil === 'ADM' && (s.status === 'NOVA' || s.status === 'PENDENTE') && projsUser.includes(s.projeto)) qtdPendenteAcao++;
                });
            }

            const listaProjetos = (perfil.projetos && perfil.projetos.length > 0) 
                ? perfil.projetos.map(p => `<span class="bg-blue-100 text-blue-900 px-2 py-0.5 rounded text-[11px] font-bold border border-blue-200">${p}</span>`).join(' ')
                : `<span class="bg-purple-100 text-purple-900 px-2.5 py-1 rounded text-xs font-bold border border-purple-200">Acesso Global (Todos os Projetos)</span>`;

            const main = document.getElementById('conteudoDinamico');
            let cardsHtml = '';

            // Banner de Acesso Rápido Mobile com contador ao vivo
            const bannerAcaoMobile = `
                <a href="todas_solicitacoes.html" class="md:hidden block bg-gradient-to-r from-blue-900 to-blue-700 text-white p-4 rounded-2xl shadow-lg border border-blue-600 active:scale-[0.99] transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full">⚡ Acesso Rápido Smartphone</span>
                            <h3 class="text-lg font-black mt-1.5">Tratar Fila de Solicitações</h3>
                            <p class="text-xs text-blue-100 mt-0.5">${qtdPendenteAcao > 0 ? `Você possui <b>${qtdPendenteAcao} solicitação(ões)</b> aguardando sua análise.` : 'Fila em dia! Toque para consultar ou filtrar.'}</p>
                        </div>
                        <div class="bg-white text-blue-900 font-black text-xl w-12 h-12 rounded-2xl flex items-center justify-center shadow shrink-0">
                            ${qtdPendenteAcao}
                        </div>
                    </div>
                </a>
            `;

            if (perfil.perfil === 'MASTER') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6">
                        <a href="todas_solicitacoes.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-blue-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">💳</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Fila de Recargas ${qtdPendenteAcao > 0 ? `<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full ml-1">${qtdPendenteAcao}</span>` : ''}</h2>
                                    <p class="text-xs text-slate-600">Liberação Vale Card, saldo real, filtros e auditoria.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-blue-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="gestao_perfis.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-purple-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">👥</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Gestão de Perfis</h2>
                                    <p class="text-xs text-slate-600">Cadastrar e gerenciar acessos (ADM, Coordenação e Master).</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-purple-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="cadastros_base.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-amber-500 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">🗄️</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Cadastros Base</h2>
                                    <p class="text-xs text-slate-600">Projetos ativos e Base de Colaboradores (Excel).</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-amber-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="dashboard.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-indigo-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">📊</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Dashboard</h2>
                                    <p class="text-xs text-slate-600">Indicadores por matrícula, valores e KM total.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-indigo-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">➕</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Solicitação Manual</h2>
                                    <p class="text-xs text-slate-600">Lançar recarga diretamente pela gestão com fotos.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-emerald-700 font-extrabold text-xs shrink-0">Lançar &rarr;</span>
                        </a>
                    </div>
                `;
            } 
            else if (perfil.perfil === 'GESTAO_CAMPO') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6">
                        <a href="todas_solicitacoes.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-orange-500 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">✅</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Analisar Solicitações ${qtdPendenteAcao > 0 ? `<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full ml-1">${qtdPendenteAcao}</span>` : ''}</h2>
                                    <p class="text-xs text-slate-600">Meus Projetos, Outros Projetos e Modo ADM (Bypass).</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-orange-600 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="gestao_perfis.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-purple-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">👤</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Meus ADMs</h2>
                                    <p class="text-xs text-slate-600">Cadastrar e gerenciar os perfis ADM criados por você.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-purple-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="dashboard.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-indigo-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">📊</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Dashboard</h2>
                                    <p class="text-xs text-slate-600">Consultar métricas financeiras e KM rodado por matrícula.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-indigo-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">🚗</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Solicitação Manual</h2>
                                    <p class="text-xs text-slate-600">Registrar recarga manualmente para um condutor.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-emerald-700 font-extrabold text-xs shrink-0">Lançar &rarr;</span>
                        </a>
                    </div>
                `;
            }
            else if (perfil.perfil === 'ADM') {
                cardsHtml = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                        <a href="todas_solicitacoes.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-blue-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">🔍</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Fila de Validação ADM ${qtdPendenteAcao > 0 ? `<span class="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full ml-1">${qtdPendenteAcao}</span>` : ''}</h2>
                                    <p class="text-xs text-slate-600">Validar fotos, parâmetro de 260 KM, motivo e saldo.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-blue-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="dashboard.html" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-indigo-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">📊</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Dashboard</h2>
                                    <p class="text-xs text-slate-600">Acompanhar histórico de solicitações e saldos liberados.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-indigo-700 font-extrabold text-xs shrink-0">Abrir &rarr;</span>
                        </a>

                        <a href="index.html?modo=manual" class="bg-white p-5 md:p-6 rounded-2xl shadow-md border-l-8 md:border-l-0 md:border-t-8 border-emerald-600 hover:-translate-y-1 hover:shadow-xl transition flex md:flex-col justify-between items-center md:items-start md:min-h-[210px]">
                            <div class="flex md:block items-center gap-3.5">
                                <div class="text-3xl md:mb-3">📝</div>
                                <div>
                                    <h2 class="text-base md:text-xl font-extrabold text-slate-800 md:mb-2">Solicitação Manual</h2>
                                    <p class="text-xs text-slate-600">Preencher formulário em nome do técnico subindo as 4 fotos.</p>
                                </div>
                            </div>
                            <span class="md:mt-4 inline-block text-emerald-700 font-extrabold text-xs shrink-0">Lançar &rarr;</span>
                        </a>
                    </div>
                `;
            }

            main.innerHTML = `
                ${bannerAcaoMobile}
                <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <div>
                        <p class="text-[10px] font-bold uppercase text-slate-400">Usuário Conectado</p>
                        <h2 class="text-lg md:text-2xl font-black text-slate-800">${perfil.nome} <span class="text-xs md:text-sm font-semibold text-slate-500">(Mat: ${perfil.matricula})</span></h2>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold uppercase text-slate-400 mb-1">Projetos Vinculados</p>
                        <div class="flex flex-wrap gap-1">${listaProjetos}</div>
                    </div>
                </div>
                ${cardsHtml}
            `;
        }

        carregarPainel();
    </script>
</body>
</html>

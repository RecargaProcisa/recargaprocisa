<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastros Base - PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <header class="bg-blue-900 text-white px-6 py-4 shadow-lg border-b-4 border-blue-700 flex justify-between">
        <h1 class="text-xl font-black">PROCISA - Cadastros Base (Fontes de Dados)</h1>
        <a href="painel.html" class="bg-slate-700 px-4 py-2 rounded font-bold text-xs">&larr; Voltar</a>
    </header>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 1. Projetos -->
        <div class="bg-white p-6 rounded-2xl shadow border border-slate-200 flex flex-col">
            <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">Projetos Ativos</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="novoProj" placeholder="Ex: 601PES000004 - ES..." class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-600 text-xs uppercase">
                <button onclick="addProjeto()" class="bg-blue-800 hover:bg-blue-900 text-white px-3 rounded font-bold transition">+</button>
            </div>
            <ul id="listaProj" class="space-y-2 text-xs font-semibold text-slate-600 h-64 overflow-y-auto pr-2"></ul>
        </div>

        <!-- 2. Matrículas e Nomes (Com Importação em Massa) -->
        <div class="bg-white p-6 rounded-2xl shadow border border-slate-200 md:col-span-2">
            <h2 class="text-lg font-bold text-purple-900 mb-4 border-b border-purple-200 pb-2 flex justify-between">
                Base de Colaboradores
                <span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded">Total: <span id="totalColab">0</span></span>
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Coluna de Inserção -->
                <div>
                    <!-- Abas de Inserção -->
                    <div class="flex gap-2 mb-3">
                        <button onclick="mudarAba('manual')" id="btnAbaManual" class="text-xs font-bold px-3 py-1.5 rounded bg-purple-600 text-white">Manual</button>
                        <button onclick="mudarAba('massa')" id="btnAbaMassa" class="text-xs font-bold px-3 py-1.5 rounded bg-slate-200 text-slate-600">Importar do Excel (Massa)</button>
                    </div>

                    <!-- Modo Manual -->
                    <div id="modoManual" class="space-y-3">
                        <input type="text" id="novaMat" placeholder="Matrícula" class="w-full px-3 py-2 border border-slate-300 rounded text-xs focus:ring-2 focus:ring-purple-600">
                        <input type="text" id="novoNomeColab" placeholder="Nome Completo" class="w-full px-3 py-2 border border-slate-300 rounded text-xs uppercase focus:ring-2 focus:ring-purple-600">
                        <input type="text" id="novoCargo" placeholder="Cargo (Opcional)" class="w-full px-3 py-2 border border-slate-300 rounded text-xs uppercase focus:ring-2 focus:ring-purple-600">
                        <button onclick="addColaboradorManual()" class="w-full bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded font-bold text-xs transition">Salvar Colaborador</button>
                    </div>

                    <!-- Modo Importação em Massa -->
                    <div id="modoMassa" class="hidden space-y-3">
                        <p class="text-[10px] text-slate-500 font-bold uppercase">Copie as 3 colunas (Matrícula, Nome, Cargo) do Excel e cole abaixo:</p>
                        <textarea id="textoMassa" rows="5" class="w-full px-3 py-2 border border-slate-300 rounded text-[10px] focus:ring-2 focus:ring-purple-600 whitespace-pre" placeholder="112233    JOAO SILVA    INSTALADOR&#10;445566    MARIA SOUZA   OFICIAL DE REDE"></textarea>
                        <button onclick="importarMassa()" id="btnImportar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded font-bold text-xs transition">Importar Linhas</button>
                    </div>
                </div>

                <!-- Coluna de Listagem -->
                <div class="border-l border-slate-200 pl-6">
                    <input type="text" id="buscaColab" oninput="filtrarColab()" placeholder="Buscar colaborador..." class="w-full px-3 py-2 border border-slate-300 rounded text-xs mb-3">
                    <div id="listaColab" class="space-y-2 h-48 overflow-y-auto pr-2"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let colaboradoresCache = [];

        function mudarAba(aba) {
            if (aba === 'manual') {
                document.getElementById('modoManual').classList.remove('hidden');
                document.getElementById('modoMassa').classList.add('hidden');
                document.getElementById('btnAbaManual').className = 'text-xs font-bold px-3 py-1.5 rounded bg-purple-600 text-white';
                document.getElementById('btnAbaMassa').className = 'text-xs font-bold px-3 py-1.5 rounded bg-slate-200 text-slate-600';
            } else {
                document.getElementById('modoManual').classList.add('hidden');
                document.getElementById('modoMassa').classList.remove('hidden');
                document.getElementById('btnAbaMassa').className = 'text-xs font-bold px-3 py-1.5 rounded bg-purple-600 text-white';
                document.getElementById('btnAbaManual').className = 'text-xs font-bold px-3 py-1.5 rounded bg-slate-200 text-slate-600';
            }
        }

        async function carregar() {
            // Carrega Projetos
            const {data: p} = await supabaseClient.from('projetos').select('nome').order('nome');
            document.getElementById('listaProj').innerHTML = p.map(x => `
                <li class="border-b border-slate-100 py-1">
                    <span class="text-blue-600 mr-1">•</span> ${x.nome}
                </li>`).join('');
            
            // Carrega Colaboradores
            const {data: c} = await supabaseClient.from('base_colaboradores').select('*').order('nome');
            colaboradoresCache = c || [];
            document.getElementById('totalColab').innerText = colaboradoresCache.length;
            renderizarColab(colaboradoresCache);
        }

        function renderizarColab(lista) {
            document.getElementById('listaColab').innerHTML = lista.map(x => `
                <div class="border-b border-slate-100 pb-1 mb-1">
                    <div class="text-[11px] font-bold text-slate-800">${x.matricula} - ${x.nome}</div>
                    ${x.cargo ? `<div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${x.cargo}</div>` : ''}
                </div>
            `).join('');
        }

        function filtrarColab() {
            const termo = document.getElementById('buscaColab').value.toUpperCase();
            const filtrado = colaboradoresCache.filter(x => x.nome.includes(termo) || x.matricula.includes(termo));
            renderizarColab(filtrado);
        }

        async function addProjeto() {
            const n = document.getElementById('novoProj').value.toUpperCase();
            if(n) { await supabaseClient.from('projetos').insert([{nome: n}]); document.getElementById('novoProj').value = ''; carregar(); }
        }

        async function addColaboradorManual() {
            const m = document.getElementById('novaMat').value;
            const n = document.getElementById('novoNomeColab').value.toUpperCase();
            const c = document.getElementById('novoCargo').value.toUpperCase();
            if(m && n) { 
                await supabaseClient.from('base_colaboradores').upsert([{matricula: m, nome: n, cargo: c}]); 
                document.getElementById('novaMat').value = '';
                document.getElementById('novoNomeColab').value = '';
                document.getElementById('novoCargo').value = '';
                carregar(); 
            }
        }

        async function importarMassa() {
            const texto = document.getElementById('textoMassa').value.trim();
            if (!texto) return;

            const btn = document.getElementById('btnImportar');
            btn.disabled = true;
            btn.innerText = 'Processando...';

            const linhas = texto.split('\n');
            const registros = [];

            for (let linha of linhas) {
                // O Excel separa as colunas por tabulação (\t)
                const colunas = linha.split('\t'); 
                if (colunas.length >= 2) {
                    const mat = colunas[0].trim();
                    const nome = colunas[1].trim().toUpperCase();
                    const cargo = colunas.length > 2 ? colunas[2].trim().toUpperCase() : null;
                    
                    // Ignora a linha de cabeçalho se você copiar por engano
                    if (mat.toUpperCase() !== 'MATRÍCULA' && mat !== '') {
                        registros.push({ matricula: mat, nome: nome, cargo: cargo });
                    }
                }
            }

            if (registros.length > 0) {
                const { error } = await supabaseClient.from('base_colaboradores').upsert(registros);
                if (error) {
                    alert('Erro na importação: ' + error.message);
                } else {
                    alert(`✅ ${registros.length} colaboradores importados com sucesso!`);
                    document.getElementById('textoMassa').value = '';
                    carregar();
                }
            } else {
                alert('Nenhum formato válido encontrado. Verifique se copiou as colunas corretamente do Excel.');
            }

            btn.disabled = false;
            btn.innerText = 'Importar Linhas';
        }

        carregar();
    </script>
</body>
</html>

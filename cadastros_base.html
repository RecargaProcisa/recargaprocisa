<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastros Base - PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <header class="bg-blue-900 text-white px-6 py-4 shadow-lg border-b-4 border-blue-700 flex justify-between">
        <h1 class="text-xl font-black">PROCISA - Cadastros Base (Fontes de Dados)</h1>
        <a href="painel.html" class="bg-slate-700 px-4 py-2 rounded font-bold text-xs">&larr; Voltar</a>
    </header>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 1. Projetos -->
        <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
            <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">Projetos Ativos</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="novoProj" placeholder="Ex: 601PES000004 - ES..." class="w-full px-3 py-2 border rounded text-xs uppercase">
                <button onclick="addProjeto()" class="bg-blue-600 text-white px-3 rounded font-bold">+</button>
            </div>
            <ul id="listaProj" class="space-y-2 text-xs font-semibold text-slate-600 h-64 overflow-y-auto"></ul>
        </div>

        <!-- 2. Matrículas e Nomes -->
        <div class="bg-white p-6 rounded-2xl shadow border border-slate-200">
            <h2 class="text-lg font-bold text-blue-900 mb-4 border-b pb-2">Base Colaboradores</h2>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <input type="text" id="novaMat" placeholder="Matrícula" class="px-3 py-2 border rounded text-xs">
                <input type="text" id="novoNomeColab" placeholder="Nome Completo" class="px-3 py-2 border rounded text-xs uppercase">
            </div>
            <button onclick="addColaborador()" class="w-full bg-purple-600 text-white px-3 py-2 rounded font-bold text-xs mb-4">Salvar Colaborador</button>
            <ul id="listaColab" class="space-y-2 text-xs font-semibold text-slate-600 h-48 overflow-y-auto"></ul>
        </div>

        <!-- 3. Dados Vale Card -->
        <div class="bg-white p-6 rounded-2xl shadow border border-emerald-300 bg-emerald-50">
            <h2 class="text-lg font-bold text-emerald-900 mb-4 border-b border-emerald-200 pb-2">Upload Dados Vale Card</h2>
            <p class="text-xs text-emerald-700 mb-4">Módulo reservado para futura integração de consumo do veículo.</p>
            <input type="file" accept=".csv, .xlsx" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 mb-4">
            <button onclick="alert('Módulo de processamento Vale Card em desenvolvimento.')" class="w-full bg-emerald-700 text-white px-3 py-2 rounded font-bold text-xs">Processar Planilha</button>
        </div>
    </main>

    <script>
        async function carregar() {
            const {data: p} = await supabaseClient.from('projetos').select('nome').order('nome');
            document.getElementById('listaProj').innerHTML = p.map(x => `<li>• ${x.nome}</li>`).join('');
            
            const {data: c} = await supabaseClient.from('base_colaboradores').select('*').order('nome');
            document.getElementById('listaColab').innerHTML = c.map(x => `<li><b>${x.matricula}</b> - ${x.nome}</li>`).join('');
        }
        async function addProjeto() {
            const n = document.getElementById('novoProj').value.toUpperCase();
            if(n) { await supabaseClient.from('projetos').insert([{nome: n}]); carregar(); }
        }
        async function addColaborador() {
            const m = document.getElementById('novaMat').value;
            const n = document.getElementById('novoNomeColab').value.toUpperCase();
            if(m && n) { await supabaseClient.from('base_colaboradores').upsert([{matricula: m, nome: n}]); carregar(); }
        }
        carregar();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Corporativo - PROCISA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-sm w-full border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900 tracking-wide">PROCISA</h1>
            <p class="text-sm text-slate-500">Acesso Restrito</p>
        </div>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail corporativo</label>
                <input type="email" id="email" required placeholder="usuario@procisa.com.br"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <button type="submit" id="btnEntrar"
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition shadow mt-2">
                Entrar no Sistema
            </button>
        </form>

        <div id="msgErro" class="mt-4 p-3 rounded-lg text-sm bg-red-100 text-red-800 border border-red-300 hidden"></div>
        
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-blue-600 hover:underline">&larr; Voltar para Solicitações de Campo</a>
        </div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEntrar');
            const msgErro = document.getElementById('msgErro');
            
            btn.disabled = true;
            btn.innerText = 'Autenticando...';
            msgErro.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('senha').value;

            // Tenta fazer o login no Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                btn.disabled = false;
                btn.innerText = 'Entrar no Sistema';
                msgErro.classList.remove('hidden');
                msgErro.innerText = 'Erro: E-mail ou senha incorretos.';
            } else {
                // Login com sucesso, redireciona para o painel
                window.location.href = 'painel.html';
            }
        });
    </script>
</body>
</html>
